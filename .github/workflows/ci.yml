name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test and MCP dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -r mcp/requirements.txt

      - name: Compile Python
        shell: pwsh
        run: |
          $files = Get-ChildItem -Recurse -Filter *.py | Where-Object { $_.FullName -notmatch "\\.venv\\" }
          foreach ($f in $files) {
            python -m py_compile $f.FullName
          }

      - name: Import MCP server
        shell: pwsh
        run: |
          Push-Location mcp
          python -c "import server; print('SUPABASE MULTI MCP IMPORT OK')"
          Pop-Location

      - name: Run tests
        shell: pwsh
        run: python -m pytest -q

  clean-install:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run setup from a clean checkout
        shell: cmd
        run: setup.bat

      - name: Verify generated local installation
        shell: pwsh
        run: |
          if (-not (Test-Path "mcp/.venv/Scripts/python.exe")) { throw "MCP virtual environment was not created." }
          if (-not (Test-Path "registry.json")) { throw "registry.json was not created." }
          & "mcp/.venv/Scripts/python.exe" -c "from mcp.server import MCPServer; print('MCP SDK OK')"

      - name: Start through public launcher and probe fast local state
        shell: pwsh
        run: |
          $env:SUPABASE_MULTI_NO_BROWSER = "1"
          cmd /c start-supabase-multi.bat
          if ($LASTEXITCODE -ne 0) { throw "start-supabase-multi.bat failed." }

          $response = Invoke-RestMethod "http://127.0.0.1:8765/api/state?local=1" -TimeoutSec 2
          if (-not $response.ok) { throw "Fast local state endpoint did not become ready." }

          # The launcher must also be safe to run twice.
          cmd /c start-supabase-multi.bat
          if ($LASTEXITCODE -ne 0) { throw "Second launcher invocation failed." }

          $listener = Get-NetTCPConnection -LocalAddress 127.0.0.1 -LocalPort 8765 -State Listen -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($listener) { Stop-Process -Id $listener.OwningProcess -Force }
