name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test and MCP dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -r mcp/requirements.txt

      - name: Compile Python
        shell: pwsh
        run: |
          $files = Get-ChildItem -Recurse -Filter *.py | Where-Object { $_.FullName -notmatch "\\.venv\\" }
          foreach ($f in $files) {
            python -m py_compile $f.FullName
          }

      - name: Import MCP server
        shell: pwsh
        run: |
          Push-Location mcp
          python -c "import server; print('SUPABASE MULTI MCP IMPORT OK')"
          Pop-Location

      - name: Run tests
        shell: pwsh
        run: python -m pytest -q

  clean-install:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run setup from a clean checkout
        shell: cmd
        run: setup.bat

      - name: Verify generated local installation
        shell: pwsh
        run: |
          if (-not (Test-Path "mcp/.venv/Scripts/python.exe")) { throw "MCP virtual environment was not created." }
          if (-not (Test-Path "registry.json")) { throw "registry.json was not created." }
          & "mcp/.venv/Scripts/python.exe" -c "from mcp.server import MCPServer; print('MCP SDK OK')"

      - name: Start control plane and probe fast local state
        shell: pwsh
        run: |
          $proc = Start-Process python -ArgumentList "local-ui/server.py" -PassThru -WindowStyle Hidden
          try {
            $ok = $false
            for ($i = 0; $i -lt 20; $i++) {
              Start-Sleep -Milliseconds 500
              try {
                $response = Invoke-RestMethod "http://127.0.0.1:8765/api/state?local=1" -TimeoutSec 2
                if ($response.ok) { $ok = $true; break }
              } catch {}
            }
            if (-not $ok) { throw "Fast local state endpoint did not become ready." }
          } finally {
            if ($proc -and -not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }
