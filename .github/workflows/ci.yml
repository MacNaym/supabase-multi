name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install MCP dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if (Test-Path "mcp/requirements.txt") {
            python -m pip install -r mcp/requirements.txt
          }

      - name: Compile Python
        shell: pwsh
        run: |
          $files = Get-ChildItem -Recurse -Filter *.py | Where-Object { $_.FullName -notmatch "\\.venv\\" }
          foreach ($f in $files) {
            python -m py_compile $f.FullName
          }

      - name: Import MCP server
        shell: pwsh
        run: |
          if (Test-Path "mcp/server.py") {
            Push-Location mcp
            python -c "import server; print('SUPABASE MULTI MCP IMPORT OK')"
            Pop-Location
          }

      - name: Run tests
        shell: pwsh
        run: |
          $tests = Get-ChildItem tests -Recurse -Filter "test_*.py" -ErrorAction SilentlyContinue
          if ($tests) {
            python -m pip install pytest
            python -m pytest -q
          } else {
            Write-Host "No Python tests found; skipping pytest."
          }
