name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate forbidden files
        shell: pwsh
        run: |
          $forbidden = @(
            "registry.json",
            "oauth-sessions.dat",
            ".env"
          )
          foreach ($item in $forbidden) {
            if (Test-Path $item) {
              throw "Forbidden release file present: $item"
            }
          }

      - name: Build release archive
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          $staging = "release-staging"
          New-Item -ItemType Directory -Path $staging | Out-Null
          git archive --format=zip --output="$staging/supabase-multi-$version.zip" HEAD
          $hash = (Get-FileHash "$staging/supabase-multi-$version.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  supabase-multi-$version.zip" | Set-Content "$staging/SHA256SUMS.txt"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-staging/*.zip
            release-staging/SHA256SUMS.txt
